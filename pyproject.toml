[project]
name = "langchain-cases"
version = "0.1.0"
description = "LangChain 示例 + 五框架对比 + Codex/Claude/Hermes/DeepSeek mini Harness（阿里云百炼）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.8,<2.0",
    "langchain-openai>=1.7.3,<2.0",
    "langchain-text-splitters>=1.1.3,<2.0",
    "langgraph>=1.2.19,<2.0",
    "python-dotenv>=1.2.4,<2.0",
    "pydantic>=2.11.9,<2.13",
    "rich>=14.3,<15",
    "numpy>=2.0,<3.0",
    "crewai>=1.15.35,<2",
    "llama-index>=0.14.25,<0.15",
    "openai-agents>=0.20.0,<0.21",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "fastmcp>=2.14.7,<3",
    "mcp>=1.30,<2",
    "llama-index-llms-openai-like>=0.7.2,<0.8",
    "ipykernel>=7.4,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "pytest>=9.2.0,<10.0",
]


